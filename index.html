<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Ζωντανεύοντας την Αρχαία Κέρκυρα — M1</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 30px;
      background: rgba(15, 15, 15, 0.78);
      color: #F7E7B6;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0,0,0,.25);
    }

    #help {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: min(88vw, 520px);
      box-sizing: border-box;
      padding: 15px 18px;
      background: rgba(10, 10, 10, 0.82);
      color: #fff;
      border-radius: 16px;
      text-align: center;
      line-height: 1.4;
      font-size: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.3);
    }
  </style>
</head>

<body>

  <div id="status">Αναζήτηση marker…</div>

  <div id="help">
    Στρέψε την κάμερα προς το marker της Γοργούς.
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets/corfu.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!-- ========================= -->
    <!-- M1 — ΓΟΡΓΩ -->
    <!-- ========================= -->

    <a-entity
      id="m1"
      mindar-image-target="targetIndex: 0">


      <!-- Decorative golden halo -->

      <a-ring
        radius-inner="0.36"
        radius-outer="0.40"
        color="#F7E7B6"
        material="shader: flat; opacity: .95"
        position="0 0.05 0.04"
        animation="
          property: rotation;
          to: 0 0 360;
          loop: true;
          dur: 10000;
          easing: linear;
        ">
      </a-ring>


      <!-- Inner decorative circle -->

      <a-ring
        radius-inner="0.43"
        radius-outer="0.445"
        color="#F7E7B6"
        material="shader: flat; opacity: .45"
        position="0 0.05 0.035"
        animation="
          property: rotation;
          to: 0 0 -360;
          loop: true;
          dur: 16000;
          easing: linear;
        ">
      </a-ring>


      <!-- Main title -->

      <a-text
        value="ΓΟΡΓΩ"
        align="center"
        color="#F7E7B6"
        width="2.8"
        position="0 0.63 0.08"
        animation="
          property: position;
          from: 0 0.59 0.08;
          to: 0 0.67 0.08;
          dir: alternate;
          loop: true;
          dur: 1800;
          easing: easeInOutSine;
        ">
      </a-text>


      <!-- Subtitle -->

      <a-text
        value="Αρχαία Κέρκυρα"
        align="center"
        color="#FFFFFF"
        width="1.65"
        position="0 0.42 0.08">
      </a-text>


      <!-- Information panel -->

      <a-plane
        width="2.05"
        height="0.82"
        color="#111111"
        material="
          shader: flat;
          opacity: .90;
        "
        position="0 -0.68 0.04">
      </a-plane>


      <!-- Panel border -->

      <a-plane
        width="1.94"
        height="0.71"
        color="#F7E7B6"
        material="
          shader: flat;
          opacity: .12;
        "
        position="0 -0.68 0.045">
      </a-plane>


      <!-- Historical information -->

      <a-text
        value="ΑΕΤΩΜΑ ΤΟΥ ΝΑΟΥ ΤΗΣ ΑΡΤΕΜΗΣ
6ος αι. π.Χ.

Κεντρική μορφή:
η Γοργώ"
        align="center"
        color="#FFFFFF"
        width="2.05"
        wrap-count="32"
        line-height="55"
        position="0 -0.68 0.08">
      </a-text>


      <!-- Small separator -->

      <a-plane
        width="0.65"
        height="0.012"
        color="#F7E7B6"
        material="shader: flat; opacity: .8"
        position="0 -1.12 0.05">
      </a-plane>


      <!-- Visitor instruction -->

      <a-text
        value="Παρατήρησε τις μορφές
και εξερεύνησε την ιστορία."
        align="center"
        color="#F7E7B6"
        width="1.75"
        wrap-count="34"
        line-height="60"
        position="0 -1.29 0.06">
      </a-text>


      <!-- Small floating points -->

      <a-sphere
        radius="0.025"
        color="#F7E7B6"
        position="-0.78 0.22 0.06"
        animation="
          property: position;
          from: -0.78 0.18 0.06;
          to: -0.78 0.30 0.06;
          dir: alternate;
          loop: true;
          dur: 1700;
          easing: easeInOutSine;
        ">
      </a-sphere>

      <a-sphere
        radius="0.018"
        color="#F7E7B6"
        position="0.76 0.18 0.06"
        animation="
          property: position;
          from: 0.76 0.15 0.06;
          to: 0.76 0.27 0.06;
          dir: alternate;
          loop: true;
          dur: 2100;
          easing: easeInOutSine;
        ">
      </a-sphere>


    </a-entity>

  </a-scene>

  <script src="./ar.js"></script>

</body>
</html>
